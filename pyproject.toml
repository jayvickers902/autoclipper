[project]
name = "autoclipper"
version = "0.1.0"
description = "Turns gameplay replays into judged, trimmed, shareable clips"
authors = [
    { name = "Jay Vickers", email = "jayvickers@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "onnxruntime>=1.20",  # PANNs AudioSet tagger (CPU); already pulled in by faster-whisper
]

[project.optional-dependencies]
# GPU whisper in WSL: cuBLAS 12 + cuDNN 9 for ctranslate2 (~1.3 GB). Without them whisper stays on the CPU.
gpu = ["nvidia-cublas-cu12", "nvidia-cudnn-cu12"]

[project.scripts]
autoclipper = "autoclipper.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_media: needs real replay files under /mnt/c/Users/jayvi/Videos (skipped when absent)",
    "whisper: runs a faster-whisper model (CPU; first run downloads it); deselect with -m 'not whisper'",
]
